name: core

on:
  push:
    branches: [main]
  pull_request:

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install '.[test,dev]'
      - run: ruff check src/spherical_cauchy experiments/mnist/interactive tests/paper_checks.py tests/test_distribution.py tests/test_direct_kl.py tests/test_laplace_kl.py tests/test_mnist_gallery.py tests/test_pairwise_kl.py tests/test_public_api.py tests/test_final_artifacts.py tests/test_paper_results_fixture.py
      - run: pytest -q tests/test_distribution.py tests/test_direct_kl.py tests/test_laplace_kl.py tests/test_mnist_gallery.py tests/test_pairwise_kl.py tests/test_public_api.py tests/test_final_artifacts.py tests/test_paper_results_fixture.py
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m venv --system-site-packages /tmp/spherical-cauchy-smoke
      - run: /tmp/spherical-cauchy-smoke/bin/python -m pip install --no-deps dist/*.whl
      - run: cd /tmp && /tmp/spherical-cauchy-smoke/bin/python -c "import torch; from spherical_cauchy import SphericalCauchy, HypersphericalUniform; from torch.distributions import kl_divergence; q=SphericalCauchy(torch.tensor([1.,0.,0.]), 0.3); p=HypersphericalUniform(3); z=q.rsample(); assert z.shape==(3,) and torch.isfinite(q.log_prob(z)) and torch.isfinite(kl_divergence(q,p))"
      - uses: actions/upload-artifact@v4
        with:
          name: distributions-py${{ matrix.python-version }}
          path: dist/*
