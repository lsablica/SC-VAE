name: Deploy MNIST sphere gallery

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build MNIST gallery
        run: python experiments/mnist_experiment/interactive_gallery/exporters/build_site.py

      - name: Disable Jekyll
        run: touch experiments/mnist_experiment/interactive_gallery/site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: experiments/mnist_experiment/interactive_gallery/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
