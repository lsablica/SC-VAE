[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spherical-cauchy"
version = "0.1.0"
description = "PyTorch spherical Cauchy distributions with exact registered KL divergence"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Lukas Sablica", email = "Lukas.Sablica@wu.ac.at"},
  {name = "Kurt Hornik", email = "Kurt.Hornik@wu.ac.at"},
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = ["torch>=2.0"]

[project.optional-dependencies]
test = ["mpmath>=1.3", "numpy>=1.24", "pytest>=8", "scipy>=1.10"]
experiments = [
  "matplotlib>=3.7",
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "torchvision>=0.15",
  "tqdm>=4.65",
]
dev = [
  "build>=1.2",
  "matplotlib>=3.7",
  "numpy>=1.24",
  "pytest>=8",
  "scipy>=1.10",
  "ruff>=0.6",
  "twine>=5",
]

[project.urls]
Repository = "https://github.com/lsablica/SC-VAE"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["spherical_cauchy*"]

[tool.setuptools.package-data]
spherical_cauchy = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
